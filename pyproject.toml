[project]
name = "musicbot"
version = "0.1.0"
description = "Self-hosted Discord music bot for the friend group server"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "discord-py[voice]>=2.7.1",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.2",
    "yt-dlp[default]==2026.8.17.73947.dev0",
    "yt-dlp-ejs>=0.8.0",
    "bgutil-ytdlp-pot-provider>=1.3.1",
]
